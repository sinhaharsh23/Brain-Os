name: BrainOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          BRAINOS_HF_HOME: ${{ runner.temp }}/huggingface
        run: python -m pytest backend/tests -q

  postgresql-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brainos
          POSTGRES_PASSWORD: brainos-ci-password
          POSTGRES_DB: brainos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brainos -d brainos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install database runtime dependencies
        run: python -m pip install -r backend/requirements-runtime.txt
      - name: Apply Alembic migrations and verify current head
        env:
          BRAINOS_DATABASE_URL: postgresql+psycopg://brainos:brainos-ci-password@127.0.0.1:5432/brainos
        run: |
          set -euo pipefail
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini current
          python -m alembic -c alembic.ini upgrade head
      - name: Verify PostgreSQL persistence ownership rollback and concurrency
        env:
          BRAINOS_DATABASE_URL: postgresql+psycopg://brainos:brainos-ci-password@127.0.0.1:5432/brainos
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures
          import os

          from sqlalchemy import inspect, select, text
          from sqlalchemy.exc import IntegrityError

          from app.persistence import (
              EXPECTED_TABLES,
              BrainSession,
              Persistence,
              Project,
              User,
              migrate_database,
          )

          url = os.environ["BRAINOS_DATABASE_URL"]
          assert url.startswith("postgresql+psycopg://")
          migrate_database(url)

          persistence = Persistence(url)
          assert persistence.engine.dialect.name == "postgresql"
          tables = set(inspect(persistence.engine).get_table_names())
          assert EXPECTED_TABLES.issubset(tables)
          with persistence.engine.connect() as connection:
              assert connection.execute(text("SELECT 1")).scalar_one() == 1

          user_a, token_a = persistence.register("postgres-owner-a", "postgres secure password a")
          user_b, token_b = persistence.register("postgres-owner-b", "postgres secure password b")
          assert persistence.user_for_token(token_a)["id"] == user_a["id"]
          assert persistence.user_for_token(token_b)["id"] == user_b["id"]
          workspace = persistence.create_workspace(user_a["id"], "PostgreSQL workspace")
          project = persistence.create_project(user_a["id"], workspace["id"], "PostgreSQL project")
          assert persistence.get_workspace(user_b["id"], workspace["id"]) is None
          assert persistence.get_project(user_b["id"], project["id"]) is None
          assert persistence.update_project(user_b["id"], project["id"], name="intrusion") is None
          persistence.create_session("postgres-session", user_a["id"], "persistent prompt", project["id"])
          persistence.create_run("postgres-run", "postgres-request", "postgres-session", user_a["id"], "postgres-connection", "persistent prompt", "qwen")
          persistence.update_run("postgres-run", "COMPLETED")

          # A new engine represents an application restart; all relational data must remain.
          persistence.engine.dispose()
          restarted = Persistence(url)
          assert restarted.user_for_token(token_a)["username"] == "postgres-owner-a"
          assert restarted.owns_session("postgres-session", user_a["id"])
          assert not restarted.owns_session("postgres-session", user_b["id"])
          with restarted.db() as db:
              assert db.get(Project, project["id"]).name == "PostgreSQL project"

          # The foreign-key failure must roll back the entire transaction.
          try:
              with restarted.db() as db:
                  db.add(User(id="rolled-back-user", username="rolled-back-user", password_hash="test"))
                  db.flush()
                  db.add(Project(id="orphan-project", owner_id="rolled-back-user", workspace_id="missing-workspace", name="orphan"))
                  db.commit()
          except IntegrityError:
              pass
          else:
              raise AssertionError("foreign-key violation did not fail")
          with restarted.db() as db:
              assert db.scalar(select(User).where(User.id == "rolled-back-user")) is None

          def concurrent_register(index: int) -> str:
              local = Persistence(url)
              try:
                  user, _ = local.register(f"postgres-concurrent-{index}", "concurrent secure password")
                  return user["username"]
              finally:
                  local.engine.dispose()

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              names = list(pool.map(concurrent_register, range(16)))
          assert len(names) == 16 and len(set(names)) == 16
          with restarted.db() as db:
              count = db.scalar(select(User).where(User.username.like("postgres-concurrent-%")).order_by(User.username))
              assert count is not None

          restarted.engine.dispose()
          print("PostgreSQL runtime persistence/ownership/rollback/concurrency PASS")
          PY

  backup-restore-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brainos
          POSTGRES_PASSWORD: brainos-ci-password
          POSTGRES_DB: brainos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brainos -d brainos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install database runtime dependencies
        run: python -m pip install -r backend/requirements-runtime.txt
      - name: Verify PostgreSQL backup and restore
        env:
          BRAINOS_DATABASE_URL: postgresql+psycopg://brainos:brainos-ci-password@127.0.0.1:5432/brainos
          POSTGRES_DUMP_URL: postgresql://brainos:brainos-ci-password@127.0.0.1:5432/brainos
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          command -v pg_dump
          command -v pg_restore
          python -m alembic -c alembic.ini upgrade head
          python - <<'PY'
          import os
          from app.persistence import Persistence

          persistence = Persistence(os.environ["BRAINOS_DATABASE_URL"])
          user, _ = persistence.register("backup-owner", "backup secure password")
          workspace = persistence.create_workspace(user["id"], "Backup workspace")
          project = persistence.create_project(user["id"], workspace["id"], "Backup project")
          persistence.create_session("backup-session", user["id"], "backup prompt", project["id"])
          persistence.engine.dispose()
          print("backup fixture created")
          PY
          pg_dump --format=custom --no-owner --file "$RUNNER_TEMP/brainos.dump" "$POSTGRES_DUMP_URL"
          test -s "$RUNNER_TEMP/brainos.dump"
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["BRAINOS_DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text("DROP SCHEMA public CASCADE"))
              connection.execute(text("CREATE SCHEMA public"))
          engine.dispose()
          print("database cleared for restore")
          PY
          pg_restore --no-owner --no-privileges --dbname "$POSTGRES_DUMP_URL" "$RUNNER_TEMP/brainos.dump"
          python - <<'PY'
          import os
          from sqlalchemy import select
          from app.persistence import BrainSession, Persistence, Project, User, Workspace

          persistence = Persistence(os.environ["BRAINOS_DATABASE_URL"])
          with persistence.db() as db:
              user = db.scalar(select(User).where(User.username == "backup-owner"))
              assert user is not None
              workspace = db.scalar(select(Workspace).where(Workspace.name == "Backup workspace"))
              assert workspace is not None and workspace.owner_id == user.id
              project = db.scalar(select(Project).where(Project.name == "Backup project"))
              assert project is not None and project.workspace_id == workspace.id and project.owner_id == user.id
              session = db.get(BrainSession, "backup-session")
              assert session is not None and session.project_id == project.id and session.owner_id == user.id
          assert persistence.owns_session("backup-session", user.id)
          persistence.engine.dispose()
          print("PostgreSQL backup/restore PASS")
          PY

  security-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install configuration dependencies
        run: python -m pip install -r backend/requirements-runtime.txt
      - name: Verify production-shaped security configuration
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          git check-ignore -q .env
          git check-ignore -q models/hf
          test -z "$(git ls-files -- .env 'models/hf/**')"
          python - <<'PY'
          from app.config import Settings

          production = Settings(
              host="0.0.0.0",
              auth_mode="multi_user",
              cors_origins="https://brainos.example",
              database_url="postgresql+psycopg://app:password@db/brainos",
              database_auto_migrate=False,
          )
          assert production.auth_mode == "multi_user"
          assert production.database_url.startswith("postgresql+psycopg://")
          assert production.cors_origins == "https://brainos.example"
          assert production.database_auto_migrate is False
          assert Settings().host == "127.0.0.1"
          print("production security configuration PASS")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run lint && npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend runtime dependencies
        run: pip-audit -r backend/requirements-runtime.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag brainos:ci .
      - name: Verify image excludes local secrets and model cache
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh brainos:ci -c 'test ! -e /app/.env && test ! -d /app/models/hf'
      - name: Start production container
        env:
          BRAINOS_VOLUME_PREFIX: brainos-runtime-${{ github.run_id }}
        run: |
          set -euo pipefail
          docker volume create "${BRAINOS_VOLUME_PREFIX}-hf"
          docker volume create "${BRAINOS_VOLUME_PREFIX}-replay"
          docker volume create "${BRAINOS_VOLUME_PREFIX}-database"
          docker run --detach --name brainos-runtime-ci --publish 8765:8765 \
            --volume "$BRAINOS_VOLUME_PREFIX-hf:/data/huggingface" \
            --volume "$BRAINOS_VOLUME_PREFIX-replay:/data/replay_sessions" \
            --volume "$BRAINOS_VOLUME_PREFIX-database:/data/brainos" \
            --env BRAINOS_HOST=0.0.0.0 \
            --env BRAINOS_PORT=8765 \
            --env BRAINOS_DEVICE=cpu \
            --env HF_HOME=/data/huggingface \
            --env BRAINOS_REPLAY_DIR=/data/replay_sessions \
            --env BRAINOS_DATABASE_URL=sqlite:////data/brainos/brainos.db \
            brainos:ci
      - name: Wait for container readiness
        run: |
          set -euo pipefail
          for attempt in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8765/api/ready > /tmp/brainos-ready.json; then
              grep -q '"status":"ready"' /tmp/brainos-ready.json
              exit 0
            fi
            sleep 2
          done
          docker logs brainos-runtime-ci
          exit 1
      - name: Verify container endpoints and WebSocket
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8765/api/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8765/ | grep -q 'id="root"'
          curl --fail --silent http://127.0.0.1:8765/api/hardware | grep -q '"device":"cpu"'
          docker exec brainos-runtime-ci python -c '
          import asyncio
          import websockets

          async def probe():
              async with websockets.connect("ws://127.0.0.1:8765/ws") as socket:
                  await socket.recv()
              print("websocket connected")

          asyncio.run(probe())
          '
      - name: Verify persistent volume and restart
        run: |
          set -euo pipefail
          docker exec brainos-runtime-ci sh -c 'printf persistent > /data/brainos/ci-marker'
          docker stop --time 30 brainos-runtime-ci
          docker rm brainos-runtime-ci
          docker run --detach --name brainos-runtime-ci --publish 8765:8765 \
            --volume "brainos-runtime-${{ github.run_id }}-hf:/data/huggingface" \
            --volume "brainos-runtime-${{ github.run_id }}-replay:/data/replay_sessions" \
            --volume "brainos-runtime-${{ github.run_id }}-database:/data/brainos" \
            --env BRAINOS_HOST=0.0.0.0 \
            --env BRAINOS_PORT=8765 \
            --env BRAINOS_DEVICE=cpu \
            --env HF_HOME=/data/huggingface \
            --env BRAINOS_REPLAY_DIR=/data/replay_sessions \
            --env BRAINOS_DATABASE_URL=sqlite:////data/brainos/brainos.db \
            brainos:ci
          for attempt in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8765/api/ready > /dev/null; then
              docker exec brainos-runtime-ci test -f /data/brainos/ci-marker
              exit 0
            fi
            sleep 2
          done
          docker logs brainos-runtime-ci
          exit 1
      - name: Capture container logs on failure
        if: failure()
        run: docker logs brainos-runtime-ci || true
      - name: Stop and remove runtime container
        if: always()
        run: |
          docker stop --time 30 brainos-runtime-ci || true
          docker rm brainos-runtime-ci || true
          docker volume rm \
            brainos-runtime-${{ github.run_id }}-hf \
            brainos-runtime-${{ github.run_id }}-replay \
            brainos-runtime-${{ github.run_id }}-database || true

  proxy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral TLS material and CI proxy config
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/brainos-tls"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/brainos-tls/privkey.pem" \
            -out "$RUNNER_TEMP/brainos-tls/fullchain.pem" \
            -subj "/CN=localhost"
          sed 's/brainos\.example/_/g' deploy/nginx/brainos.conf.example > "$RUNNER_TEMP/brainos.conf"
      - name: Validate Nginx TLS configuration
        run: |
          set -euo pipefail
          docker network create brainos-proxy-config
          docker run --detach --name brainos-proxy-config-upstream \
            --network brainos-proxy-config --network-alias brainos \
            alpine:3.20 sleep 300
          docker run --rm \
            --network brainos-proxy-config \
            --volume "$RUNNER_TEMP/brainos.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$RUNNER_TEMP/brainos-tls:/etc/nginx/tls:ro" \
            nginx:1.27-alpine nginx -t
      - name: Clean up Nginx config test network
        if: always()
        run: |
          docker rm --force brainos-proxy-config-upstream || true
          docker network rm brainos-proxy-config || true

  websocket-proxy-runtime:
    runs-on: ubuntu-latest
    needs: proxy-config
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag brainos:proxy-ci .
      - name: Create ephemeral TLS material and proxy config
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/brainos-tls"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/brainos-tls/privkey.pem" \
            -out "$RUNNER_TEMP/brainos-tls/fullchain.pem" \
            -subj "/CN=localhost"
          sed 's/brainos\.example/_/g' deploy/nginx/brainos.conf.example > "$RUNNER_TEMP/brainos.conf"
      - name: Start BrainOS and Nginx TLS proxy
        run: |
          set -euo pipefail
          docker network create brainos-proxy-ci
          docker volume create brainos-proxy-ci-hf
          docker volume create brainos-proxy-ci-replay
          docker volume create brainos-proxy-ci-database
          docker run --detach --name brainos-proxy-app --network brainos-proxy-ci --network-alias brainos \
            --volume brainos-proxy-ci-hf:/data/huggingface \
            --volume brainos-proxy-ci-replay:/data/replay_sessions \
            --volume brainos-proxy-ci-database:/data/brainos \
            --env BRAINOS_HOST=0.0.0.0 \
            --env BRAINOS_PORT=8765 \
            --env BRAINOS_DEVICE=cpu \
            --env HF_HOME=/data/huggingface \
            --env BRAINOS_REPLAY_DIR=/data/replay_sessions \
            --env BRAINOS_DATABASE_URL=sqlite:////data/brainos/brainos.db \
            brainos:proxy-ci
          docker run --detach --name brainos-proxy-nginx --network brainos-proxy-ci \
            --publish 8443:443 --publish 8080:80 \
            --volume "$RUNNER_TEMP/brainos.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$RUNNER_TEMP/brainos-tls:/etc/nginx/tls:ro" \
            nginx:1.27-alpine
      - name: Wait for proxied readiness
        run: |
          set -euo pipefail
          for attempt in {1..180}; do
            if curl --fail --silent --insecure https://127.0.0.1:8443/api/ready > /tmp/brainos-proxy-ready.json; then
              grep -q '"status":"ready"' /tmp/brainos-proxy-ready.json
              exit 0
            fi
            sleep 2
          done
          docker logs brainos-proxy-app
          docker logs brainos-proxy-nginx
          exit 1
      - name: Verify HTTPS redirect health and WebSocket upgrade
        run: |
          set -euo pipefail
          curl --silent --show-error --insecure --head http://127.0.0.1:8080/api/health | grep -q '308'
          curl --fail --silent --insecure https://127.0.0.1:8443/api/health | grep -q '"status":"ok"'
          docker exec brainos-proxy-app python - <<'PY'
          import asyncio
          import json
          import ssl

          import websockets

          async def probe():
              tls = ssl._create_unverified_context()
              async with websockets.connect("wss://brainos-proxy-nginx/ws", ssl=tls) as socket:
                  await socket.send(json.dumps({"action": "invalid-proxy-smoke"}))
                  response = json.loads(await socket.recv())
                  assert response["type"] == "error"
              print("TLS WebSocket proxy PASS")

          asyncio.run(probe())
          PY
      - name: Capture proxy logs on failure
        if: failure()
        run: |
          docker logs brainos-proxy-app || true
          docker logs brainos-proxy-nginx || true
      - name: Stop and remove proxy stack
        if: always()
        run: |
          docker stop --time 30 brainos-proxy-nginx brainos-proxy-app || true
          docker rm brainos-proxy-nginx brainos-proxy-app || true
          docker volume rm brainos-proxy-ci-hf brainos-proxy-ci-replay brainos-proxy-ci-database || true
          docker network rm brainos-proxy-ci || true

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies and build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start BrainOS
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          BRAINOS_HF_HOME: ${{ runner.temp }}/huggingface
          BRAINOS_DEVICE: cpu
          BRAINOS_DATABASE_URL: sqlite:////tmp/brainos-ci.db
          BRAINOS_REPLAY_DIR: /tmp/brainos-ci-replays
        run: nohup python backend/run.py > /tmp/brainos.log 2>&1 &
      - name: Wait for model readiness
        run: |
          for attempt in {1..120}; do
            curl --fail --silent http://127.0.0.1:8765/api/ready && exit 0
            sleep 2
          done
          cat /tmp/brainos.log
          exit 1
      - name: Run real browser suite
        working-directory: frontend
        run: npm run test:browser
      - name: Run auth browser suite
        working-directory: frontend
        env:
          BRAINOS_PYTHON: python
          BRAINOS_HF_OFFLINE: "0"
          HF_HOME: ${{ runner.temp }}/huggingface
          BRAINOS_HF_HOME: ${{ runner.temp }}/huggingface
        run: npm run test:browser:auth
